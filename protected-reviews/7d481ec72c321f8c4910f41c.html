document.getElementById('unlock').addEventListener('submit',async e=>{e.preventDefault();const b=document.getElementById('submit');b.disabled=true;document.getElementById('error').textContent='';try{const pass=document.getElementById('username').value+'\n'+document.getElementById('password').value;const material=await crypto.subtle.importKey('raw',new TextEncoder().encode(pass),'PBKDF2',false,['deriveKey']);const key=await crypto.subtle.deriveKey({name:'PBKDF2',salt:bytes(P.salt),iterations:600000,hash:'SHA-256'},material,{name:'AES-GCM',length:256},false,['decrypt']);const plain=await crypto.subtle.decrypt({name:'AES-GCM',iv:bytes(P.iv)},key,bytes(P.data));document.getElementById('password').value='';const c=document.getElementById('content');c.innerHTML=new TextDecoder().decode(plain);c.hidden=false;document.getElementById('gate').remove();}catch(err){document.getElementById('error').textContent='아이디·비밀번호가 다르거나 복호화를 지원하지 않는 브라우저입니다.';}finally{b.disabled=false;}});
