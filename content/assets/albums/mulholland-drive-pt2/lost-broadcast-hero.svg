<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">Mulholland Drive Pt.2 — lost broadcast archive</title>
  <desc id="desc">A black figure in an off-white purgatory room watches a blue-green CRT while a distant island light and red grading line remain on a damaged broadcast tape.</desc>
  <defs>
    <linearGradient id="room" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#e6e2d8"/>
      <stop offset="0.56" stop-color="#aaa99f"/>
      <stop offset="1" stop-color="#1c1c1c"/>
    </linearGradient>
    <radialGradient id="crtGlow" cx="50%" cy="45%" r="62%">
      <stop offset="0" stop-color="#7fb6b0" stop-opacity=".95"/>
      <stop offset=".45" stop-color="#243f4a" stop-opacity=".9"/>
      <stop offset="1" stop-color="#111719"/>
    </radialGradient>
    <radialGradient id="islandGlow">
      <stop offset="0" stop-color="#f0df9a"/>
      <stop offset=".16" stop-color="#e8a33d" stop-opacity=".9"/>
      <stop offset="1" stop-color="#e8a33d" stop-opacity="0"/>
    </radialGradient>
    <filter id="softGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="18"/>
    </filter>
    <filter id="tape" x="-10%" y="-10%" width="120%" height="120%">
      <feTurbulence type="fractalNoise" baseFrequency=".75 .018" numOctaves="2" seed="28" result="noise"/>
      <feColorMatrix in="noise" type="saturate" values="0" result="mono"/>
      <feComponentTransfer in="mono" result="faint">
        <feFuncA type="table" tableValues="0 .16"/>
      </feComponentTransfer>
      <feBlend in="SourceGraphic" in2="faint" mode="screen"/>
    </filter>
    <pattern id="scan" width="4" height="4" patternUnits="userSpaceOnUse">
      <rect width="4" height="1" fill="#000" opacity=".18"/>
    </pattern>
    <clipPath id="screenClip">
      <rect x="1060" y="290" width="360" height="255" rx="34"/>
    </clipPath>
  </defs>

  <g filter="url(#tape)">
    <rect width="1600" height="900" fill="url(#room)"/>
    <rect x="0" y="660" width="1600" height="240" fill="#121313"/>
    <path d="M0 662 L1600 606 L1600 900 L0 900 Z" fill="#171818"/>

    <!-- distant window and unreachable island light -->
    <rect x="110" y="118" width="540" height="300" rx="3" fill="#142024" stroke="#b8b4aa" stroke-width="12"/>
    <path d="M120 390 C265 330 430 405 640 350 L640 410 L120 410 Z" fill="#090c0e"/>
    <circle cx="500" cy="327" r="74" fill="url(#islandGlow)" filter="url(#softGlow)"/>
    <circle cx="500" cy="327" r="5" fill="#f0df9a"/>
    <path d="M380 120 L310 418 M570 120 L620 418" stroke="#d8d4c9" stroke-opacity=".18" stroke-width="5"/>

    <!-- black-clad figure -->
    <ellipse cx="755" cy="800" rx="205" ry="42" fill="#000" opacity=".55"/>
    <path d="M704 319 C648 346 632 430 643 510 L594 757 C705 802 873 800 961 742 L896 515 C906 421 850 343 808 321 Z" fill="#060606"/>
    <ellipse cx="757" cy="284" rx="95" ry="118" fill="#c8c1b3"/>
    <path d="M663 280 C664 163 845 134 856 283 C830 224 795 210 755 210 C706 210 681 235 663 280 Z" fill="#101112"/>
    <!-- missing-file face layers -->
    <path d="M680 238 C735 210 819 215 847 250 L825 287 L849 321 L811 354 L744 345 L692 369 L668 325 L699 291 Z" fill="#060606"/>
    <path d="M679 260 L838 225 M666 298 L848 266 M676 337 L831 301 M705 363 L817 330" stroke="#28292a" stroke-width="13" stroke-linecap="round" opacity=".9"/>
    <path d="M716 388 L668 555 L714 601" fill="none" stroke="#aaa99f" stroke-width="4" opacity=".28"/>

    <!-- CRT -->
    <rect x="1008" y="240" width="474" height="382" rx="55" fill="#181b1c" stroke="#070809" stroke-width="24"/>
    <rect x="1040" y="270" width="400" height="300" rx="44" fill="url(#crtGlow)" stroke="#4c5758" stroke-width="9"/>
    <g clip-path="url(#screenClip)">
      <rect x="1040" y="270" width="400" height="300" fill="url(#scan)"/>
      <path d="M1040 388 C1150 350 1290 438 1440 368" stroke="#5E2CA5" stroke-width="5" opacity=".62"/>
      <path d="M1040 444 C1180 410 1310 486 1440 432" stroke="#F04A52" stroke-width="4" opacity=".66"/>
      <rect x="1040" y="500" width="400" height="20" fill="#d9e7e4" opacity=".16"/>
    </g>
    <circle cx="1122" cy="590" r="12" fill="#F04A52"/>
    <circle cx="1170" cy="590" r="9" fill="#555b5a"/>
    <path d="M1072 628 L1414 628 L1460 744 L1018 744 Z" fill="#0e1010"/>

    <!-- restrained red grading slash -->
    <path d="M168 735 L980 635" stroke="#F04A52" stroke-width="18" opacity=".78"/>
    <path d="M172 765 L974 665" stroke="#F04A52" stroke-width="3" opacity=".5"/>

    <!-- broadcast UI -->
    <g fill="#e6e2d8" font-family="ui-monospace, SFMono-Regular, Consolas, monospace">
      <text x="72" y="70" font-size="22" letter-spacing="5">CHD ARCHIVE / MD.PT2</text>
      <text x="72" y="99" font-size="15" opacity=".7">2004. 01:37:06  •  NO BROADCAST RECORD</text>
      <text x="1260" y="70" font-size="17" text-anchor="end" opacity=".7">CHANNEL 08</text>
      <text x="1525" y="835" font-size="15" text-anchor="end" opacity=".58">SIGNAL RECOVERED / GENERATION 02</text>
    </g>

    <!-- tracking tears -->
    <rect x="0" y="186" width="1600" height="7" fill="#d8e3df" opacity=".28"/>
    <rect x="0" y="191" width="740" height="3" fill="#F04A52" opacity=".55"/>
    <rect x="520" y="520" width="1080" height="5" fill="#a4c9c2" opacity=".2"/>
    <rect x="0" y="822" width="1600" height="2" fill="#e6e2d8" opacity=".22"/>
  </g>
</svg>
