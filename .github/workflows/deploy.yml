name: Deploy CHUCK WIKI to GitHub Pages

on:
  push:
    branches:
      - v5
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Build Quartz
        run: npx quartz build
      - name: Copy encrypted review pages
        run: |
          mkdir -p public/review
          cp protected-reviews/*.html public/review/
      - name: Copy encrypted exact-upload reader
        run: |
          mkdir -p public/reader
          cp protected-reader/index.html public/reader/index.html
      - name: Copy encrypted video review
        run: |
          mkdir -p public/video-review
          cp protected-video-review/index.html protected-video-review/app.js protected-video-review/style.css protected-video-review/payload.json public/video-review/
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: public

  deploy:
    needs: build
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
